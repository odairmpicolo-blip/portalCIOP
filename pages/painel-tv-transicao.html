<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal CIOP TCGL</title>
<style>
  :root{
    --bg-1:#050b18;
    --bg-2:#0a1730;
    --ink:#f4f8ff;
    --muted:rgba(226,234,250,.62);
    --muted-2:rgba(226,234,250,.4);
    --cyan:#38bdf8;
    --teal:#2dd4bf;
    --amber:#f59e0b;
    --panel-border:rgba(255,255,255,.09);
    --bus1-a:#7dd3fc; --bus1-b:#38bdf8;
    --bus2-a:#fde68a; --bus2-b:#f5b71c;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%; min-height:100%;
    background:
      radial-gradient(1300px 900px at 50% -12%, rgba(56,189,248,.18), transparent 60%),
      radial-gradient(1000px 700px at 90% 100%, rgba(45,212,191,.14), transparent 55%),
      linear-gradient(180deg, var(--bg-1), var(--bg-2) 55%, #060c1a);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    overflow:hidden; position:relative;
  }
  body::before{
    content:""; position:fixed; inset:-2px; pointer-events:none; z-index:0;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size:46px 46px;
    -webkit-mask-image:radial-gradient(circle at 50% 30%, black, transparent 78%);
    mask-image:radial-gradient(circle at 50% 30%, black, transparent 78%);
    animation:tvGridDrift 70s linear infinite;
  }
  @keyframes tvGridDrift{ from{ background-position:0 0,0 0; } to{ background-position:460px 460px,460px 460px; } }

  .scene{
    position:relative; z-index:1; width:100%; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:clamp(16px,3vh,40px) 16px;
  }

  /* ===== Skyline (silhueta de fundo) ===== */
  .skyline{
    position:absolute; left:0; right:0; bottom:clamp(78px,16vh,150px);
    height:clamp(70px,16vh,180px); z-index:0; opacity:.55;
    display:flex; align-items:flex-end; justify-content:center; gap:clamp(6px,1vw,14px);
    filter:drop-shadow(0 0 18px rgba(56,189,248,.18));
  }
  .skyline b{
    display:block; background:linear-gradient(180deg, rgba(56,189,248,.16), rgba(10,23,48,.55));
    border:1px solid rgba(255,255,255,.06); border-bottom:none;
    border-radius:4px 4px 0 0; flex:0 0 auto;
  }
  .skyline b:nth-child(1){ width:clamp(22px,3.4vw,46px); height:38%; }
  .skyline b:nth-child(2){ width:clamp(26px,4vw,54px); height:64%; }
  .skyline b:nth-child(3){ width:clamp(20px,3vw,40px); height:48%; }
  .skyline b:nth-child(4){ width:clamp(30px,4.6vw,62px); height:88%; }
  .skyline b:nth-child(5){ width:clamp(22px,3.4vw,46px); height:56%; }
  .skyline b:nth-child(6){ width:clamp(28px,4.2vw,58px); height:100%; }
  .skyline b:nth-child(7){ width:clamp(20px,3vw,40px); height:44%; }
  .skyline b:nth-child(8){ width:clamp(26px,4vw,54px); height:70%; }
  .skyline b:nth-child(9){ width:clamp(22px,3.4vw,46px); height:34%; }

  /* ===== Pista com os ônibus chegando ===== */
  .road{
    position:absolute; left:0; right:0; bottom:0; z-index:2;
    height:clamp(78px,16vh,150px);
    background:linear-gradient(180deg, rgba(6,12,26,0), rgba(4,9,20,.92) 40%, #030711 100%);
    overflow:hidden;
  }
  .road::before{
    content:""; position:absolute; top:0; left:0; right:0; height:2px;
    background:linear-gradient(90deg, transparent, rgba(56,189,248,.7), transparent);
    background-size:200% 100%; animation:tvShimmer 3.6s ease-in-out infinite;
  }
  @keyframes tvShimmer{ 0%{ background-position:220% 0; } 100%{ background-position:-220% 0; } }
  .road-lines{
    position:absolute; left:0; right:0; bottom:14%; height:4px;
    background-image:repeating-linear-gradient(90deg, rgba(255,255,255,.35) 0 26px, transparent 26px 54px);
    animation:roadScroll 1.1s linear infinite;
  }
  @keyframes roadScroll{ from{ background-position:0 0; } to{ background-position:-80px 0; } }

  .bus{
    position:absolute; bottom:10%; width:clamp(120px,15vw,220px);
    filter:drop-shadow(0 10px 18px rgba(0,0,0,.45));
    opacity:0; transform:translateX(130vw) scale(.85);
  }
  .bus svg{ display:block; width:100%; height:auto; }
  .bus-1{ left:56%; animation:busIn1 2.3s cubic-bezier(.2,.9,.25,1) .1s forwards; }
  .bus-2{ left:24%; width:clamp(100px,12.5vw,182px); animation:busIn2 2.3s cubic-bezier(.2,.9,.25,1) .55s forwards; }
  @keyframes busIn1{
    0%{ opacity:0; transform:translateX(130vw) scale(.85); }
    70%{ opacity:1; transform:translateX(0) scale(1.02); }
    85%{ transform:translateX(-6px) scale(1); }
    100%{ opacity:1; transform:translateX(0) scale(1); }
  }
  @keyframes busIn2{
    0%{ opacity:0; transform:translateX(150vw) scale(.8); }
    70%{ opacity:1; transform:translateX(0) scale(.97); }
    85%{ transform:translateX(-6px) scale(.95); }
    100%{ opacity:1; transform:translateX(0) scale(.95); }
  }
  .bus-headlight{ animation:headlightPulse 1.4s ease-in-out 2.4s infinite; }
  @keyframes headlightPulse{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
  .bus-sheen{ animation:busSheen 3.2s ease-in-out 2.6s infinite; }
  @keyframes busSheen{ 0%,100%{ opacity:.12; } 50%{ opacity:.4; } }

  /* ===== Revelação da marca ===== */
  .brand-reveal{
    position:relative; z-index:3; display:flex; flex-direction:column; align-items:center;
    gap:clamp(10px,1.6vh,18px); text-align:center; margin-bottom:clamp(70px,14vh,130px);
  }
  .logo-ring-wrap{ position:relative; display:flex; align-items:center; justify-content:center; }
  .logo-ring{
    position:absolute; border-radius:50%; border:1px solid rgba(56,189,248,.55);
    width:clamp(90px,11vw,150px); height:clamp(90px,11vw,150px);
    opacity:0; animation:ringPulse 2.6s ease-out 2.5s infinite;
  }
  .logo-ring.ring-2{ animation-delay:3.3s; border-color:rgba(45,212,191,.5); }
  @keyframes ringPulse{
    0%{ opacity:.85; transform:scale(.6); }
    75%{ opacity:0; transform:scale(2.1); }
    100%{ opacity:0; transform:scale(2.1); }
  }
  .logo-big{
    position:relative; height:clamp(64px,9vh,130px); width:auto; object-fit:contain;
    opacity:0; transform:scale(.55) translateY(10px);
    animation:logoReveal 1.1s cubic-bezier(.2,.9,.2,1) 2.3s forwards;
    filter:drop-shadow(0 0 22px rgba(56,189,248,.55)) drop-shadow(0 0 44px rgba(45,212,191,.3));
  }
  @keyframes logoReveal{
    0%{ opacity:0; transform:scale(.55) translateY(10px); }
    70%{ opacity:1; transform:scale(1.06) translateY(0); }
    100%{ opacity:1; transform:scale(1) translateY(0); }
  }
  .tagline{
    font-size:clamp(18px,2.4vw,34px); font-weight:900; color:var(--ink); letter-spacing:.01em;
    opacity:0; transform:translateY(8px);
    animation:taglineFade .8s ease-out 3.1s forwards;
  }
  .tagline-sub{
    font-size:clamp(11px,1vw,16px); font-weight:700; color:var(--muted); text-transform:uppercase;
    letter-spacing:.16em; opacity:0; transform:translateY(8px);
    animation:taglineFade .8s ease-out 3.4s forwards;
  }
  @keyframes taglineFade{ to{ opacity:1; transform:translateY(0); } }

  /* ===== Indicador do próximo painel ===== */
  .next-hint{
    position:absolute; left:0; right:0; bottom:clamp(10px,2vh,22px); z-index:4;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    opacity:0; animation:taglineFade .8s ease-out 3.7s forwards;
  }
  .next-label{
    font-size:clamp(11px,.95vw,15px); font-weight:700; color:var(--muted-2);
    text-transform:uppercase; letter-spacing:.12em;
  }
  .next-progress{
    width:clamp(160px,22vw,320px); height:3px; border-radius:3px;
    background:rgba(255,255,255,.1); overflow:hidden;
  }
  .next-progress-bar{
    height:100%; width:0%; border-radius:3px;
    background:linear-gradient(90deg, var(--cyan), var(--teal));
    box-shadow:0 0 10px rgba(56,189,248,.6);
  }
  .next-progress-bar.anim{ animation:nextProgresso linear forwards; }
  @keyframes nextProgresso{ from{ width:0%; } to{ width:100%; } }

  /* ===== Responsivo (mobile) ===== */
  @media (max-width:640px){
    html,body{ overflow:auto; }
    .scene{ padding:16px 12px; justify-content:flex-start; padding-top:12vh; }
    .skyline{ display:none; }
    .road{ height:96px; }
    .bus{ width:120px; }
    .bus-2{ width:100px; }
    .brand-reveal{ margin-bottom:120px; gap:8px; }
    .logo-big{ height:56px; }
    .tagline{ font-size:16px; }
    .tagline-sub{ font-size:9px; letter-spacing:.12em; }
    .next-progress{ width:180px; }
  }
</style>
</head>
<body>

<div class="scene">
  <div class="skyline">
    <b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b>
  </div>

  <div class="road">
    <div class="road-lines"></div>
    <div class="bus bus-1">
      <svg viewBox="0 0 220 96" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="busBody1" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="var(--bus1-a)"/>
            <stop offset="100%" stop-color="var(--bus1-b)"/>
          </linearGradient>
        </defs>
        <rect x="4" y="22" width="212" height="46" rx="16" fill="url(#busBody1)"/>
        <rect x="4" y="22" width="212" height="46" rx="16" fill="#fff" class="bus-sheen"/>
        <rect x="16" y="30" width="34" height="20" rx="5" fill="#0a1730" opacity=".88"/>
        <rect x="56" y="30" width="34" height="20" rx="5" fill="#0a1730" opacity=".88"/>
        <rect x="96" y="30" width="34" height="20" rx="5" fill="#0a1730" opacity=".88"/>
        <rect x="136" y="30" width="34" height="20" rx="5" fill="#0a1730" opacity=".88"/>
        <rect x="4" y="54" width="212" height="7" fill="#e11d2e"/>
        <circle cx="46" cy="78" r="14" fill="#0b1220"/>
        <circle cx="46" cy="78" r="6" fill="#3a4358"/>
        <circle cx="168" cy="78" r="14" fill="#0b1220"/>
        <circle cx="168" cy="78" r="6" fill="#3a4358"/>
        <rect x="200" y="34" width="12" height="10" rx="3" fill="#fff" class="bus-headlight"/>
        <rect x="0" y="40" width="10" height="8" rx="3" fill="#fb7185" opacity=".85"/>
      </svg>
    </div>
    <div class="bus bus-2">
      <svg viewBox="0 0 220 96" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="busBody2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="var(--bus2-a)"/>
            <stop offset="100%" stop-color="var(--bus2-b)"/>
          </linearGradient>
        </defs>
        <rect x="4" y="22" width="212" height="46" rx="16" fill="url(#busBody2)"/>
        <rect x="4" y="22" width="212" height="46" rx="16" fill="#fff" class="bus-sheen"/>
        <rect x="16" y="30" width="34" height="20" rx="5" fill="#0a1730" opacity=".88"/>
        <rect x="56" y="30" width="34" height="20" rx="5" fill="#0a1730" opacity=".88"/>
        <rect x="96" y="30" width="34" height="20" rx="5" fill="#0a1730" opacity=".88"/>
        <rect x="136" y="30" width="34" height="20" rx="5" fill="#0a1730" opacity=".88"/>
        <rect x="4" y="54" width="212" height="7" fill="#0f8f56"/>
        <circle cx="46" cy="78" r="14" fill="#0b1220"/>
        <circle cx="46" cy="78" r="6" fill="#3a4358"/>
        <circle cx="168" cy="78" r="14" fill="#0b1220"/>
        <circle cx="168" cy="78" r="6" fill="#3a4358"/>
        <rect x="200" y="34" width="12" height="10" rx="3" fill="#fff" class="bus-headlight"/>
        <rect x="0" y="40" width="10" height="8" rx="3" fill="#fb7185" opacity=".85"/>
      </svg>
    </div>
  </div>

  <div class="brand-reveal">
    <div class="logo-ring-wrap">
      <div class="logo-ring ring-1"></div>
      <div class="logo-ring ring-2"></div>
      <img class="logo-big" src="../assets/img/LOGO_TCGL-dark.png" alt="TCGL">
    </div>
    <div class="tagline">Transportes Coletivos Grande Londrina</div>
    <div class="tagline-sub">Portal CIOP · Mobilidade em tempo real</div>
  </div>

  <div class="next-hint">
    <span class="next-label" id="nextLabel">Carregando próximo painel…</span>
    <div class="next-progress"><div class="next-progress-bar" id="nextBar"></div></div>
  </div>
</div>

<script>
  const NOMES_PAINEL = {
    "painel-tv-ipv.html": "Pontualidade da Frota",
    "painel-tv-icv.html": "Cumprimento de Viagens",
    "painel-tv-km.html": "Quilometragem TCGL"
  };
  const params = new URLSearchParams(window.location.search);
  const PROXIMA_PAGINA = params.get("next") || "painel-tv-ipv.html";
  const DURACAO_MS = 8000;

  const nomePainel = NOMES_PAINEL[PROXIMA_PAGINA] || "Painel";
  document.getElementById("nextLabel").textContent = "A seguir: " + nomePainel;

  const barra = document.getElementById("nextBar");
  barra.style.animationDuration = DURACAO_MS + "ms";
  barra.classList.add("anim");

  setTimeout(() => { window.location.href = PROXIMA_PAGINA; }, DURACAO_MS);
</script>
</body>
</html>
